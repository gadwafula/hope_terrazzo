name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev gzip zip unzip openjdk-17-jdk lld clang autoconf libtool pkg-config zlib1g-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade "cython<3.0" buildozer

      - name: Build APK
        env:
          BUILDOZER_ALLOW_KIVY_BUILD_ENV_AS_ROOT: 1
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hope-Terrazzo-APK
          path: bin/*.apk
